<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0A0A0A">
  <title>Administración · IRUÑARTEA</title>
  <link rel="icon" href="../assets/favicon-irunartea.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=1">
  <script type="module" src="js/app.js?v=1"></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on" novalidate>
      <h1>IRUÑARTEA</h1>
      <p class="login-sub">Panel de administración</p>
      <label for="login-email">Correo</label>
      <input id="login-email" type="email" autocomplete="username" required maxlength="120">
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" autocomplete="current-password" required maxlength="72">
      <button class="btn" type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn menu" type="button" aria-label="Abrir menú">☰</button>
      <strong class="logo">IRUÑARTEA <span>Admin</span></strong>
      <span id="user-email" class="user"></span>
      <a class="btn ghost small" href="../index.html" target="_blank" rel="noopener noreferrer">Ver web</a>
      <button id="logout" class="btn ghost small" type="button">Salir</button>
    </header>
    <nav id="nav" class="nav" aria-label="Secciones"></nav>
    <main id="view" class="view"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
